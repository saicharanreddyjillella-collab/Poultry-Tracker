services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: poultrytrack
      POSTGRES_USER: poultrytrack
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poultrytrack"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      - DATABASE_URL=postgres://poultrytrack:${DB_PASSWORD}@db:5432/poultrytrack
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
      - ALLOWED_HOSTS=${DOMAIN},${SERVER_IP},localhost
      - CORS_ALLOWED_ORIGINS=https://${DOMAIN},http://${DOMAIN}
      # E7 error monitoring — leave SENTRY_DSN unset to disable
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0}
      # System Health page reads the nightly backup's status (deploy/backup.sh)
      - BACKUP_STATUS_FILE=/backups/last_backup.json
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Hits /api/health/ (DB connectivity). No curl in the slim image, so use Python.
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8000/api/health/', timeout=5); sys.exit(0 if r.status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - static_files:/app/static
      - media_files:/app/media
      - ${BACKUP_DIR:-/root/backups}:/backups:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    restart: always

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_files:/app/static
      - media_files:/app/media
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  static_files:
  media_files:
