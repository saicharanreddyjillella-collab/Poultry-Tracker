# Run the PRODUCTION build locally (Mac/PC) — same images, DEBUG=False,
# Postgres, gunicorn, nginx — but over plain http on http://localhost:8080.
#
#   bash deploy/local-up.sh            # recommended (creates .env.local, admin)
#   or:
#   docker compose --env-file .env.local -f docker-compose.yml -f docker-compose.local.yml up -d --build
services:
  backend:
    environment:
      - DISABLE_HTTPS=True                # no TLS locally: no https redirect / secure cookies
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - CORS_ALLOWED_ORIGINS=http://localhost:8080,http://127.0.0.1:8080
      - SENTRY_ENVIRONMENT=local
      - BACKUP_STATUS_FILE=                # no nightly backups on this computer
    volumes: !override                    # (no server backup folder to mount here)
      - static_files:/app/static
      - media_files:/app/media
  nginx:
    ports: !override
      - "8080:80"
    volumes: !override
      - ./deploy/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/static
      - media_files:/app/media
